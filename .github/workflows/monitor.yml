name: 招聘岗位监控

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 1:00 = 北京时间每天 9:00（GitHub 定时可能有几分钟延迟）
  workflow_dispatch:       # 支持手动触发，用于测试

permissions:
  contents: write          # 允许回写岗位快照到仓库

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行监控
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SPREADSHEET_TOKEN: ${{ secrets.FEISHU_SPREADSHEET_TOKEN }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python monitor.py

      - name: 回写岗位快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs_data
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: 更新岗位快照 [skip ci]"
            git pull --rebase origin main
            git push
          fi
